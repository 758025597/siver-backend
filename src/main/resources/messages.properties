# Mensajes de validacion de los DTO.
# Clave: entidad.campo.regla  ->  se usa en el DTO como message = "{entidad.campo.regla}"
# Los lee ValidationConfig (UTF-8).

# CategoriaRequest
categoria.nombre.notblank=El nombre de la categoría es obligatorio
categoria.nombre.size=El nombre debe tener entre 3 y 80 caracteres
categoria.descripcion.size=La descripción no puede superar los 200 caracteres

# ClienteRequest
cliente.tipoDocumento.notblank=El tipo de documento es obligatorio
cliente.tipoDocumento.pattern=El tipo de documento debe ser DNI, RUC o CE
cliente.numeroDocumento.notblank=El número de documento es obligatorio
cliente.numeroDocumento.size=El número de documento no puede superar los 12 caracteres
cliente.nombres.notblank=Los nombres son obligatorios
cliente.nombres.size=Los nombres deben tener entre 3 y 150 caracteres
cliente.telefono.pattern=El teléfono debe tener 9 dígitos y comenzar con 9
cliente.correo.email=El correo debe tener un formato válido
cliente.correo.size=El correo no puede superar los 120 caracteres
cliente.direccion.size=La dirección no puede superar los 200 caracteres
cliente.documentoValido.asserttrue=El número no corresponde al tipo de documento: 

# DetalleVentaRequest
detalleVenta.idProducto.notnull=El producto es obligatorio
detalleVenta.cantidad.notnull=La cantidad es obligatoria
detalleVenta.cantidad.positive=La cantidad debe ser mayor a cero
detalleVenta.precioUnitario.notnull=El precio unitario es obligatorio
detalleVenta.precioUnitario.positive=El precio unitario debe ser mayor a cero
detalleVenta.descuento.positiveorzero=El descuento no puede ser negativo
detalleVenta.descuentoValido.asserttrue=El descuento no puede ser mayor al importe de la línea

# EstadoOrdenRequest
estadoOrden.nombre.notblank=El nombre del estado es obligatorio
estadoOrden.nombre.size=El nombre no puede superar los 50 caracteres
estadoOrden.descripcion.size=La descripción no puede superar los 200 caracteres
estadoOrden.ordenFlujo.notnull=El orden de flujo es obligatorio
estadoOrden.ordenFlujo.positive=El orden de flujo debe ser mayor a cero
estadoOrden.esFinal.notnull=Debe indicar si es un estado final

# LoginRequest
login.correo.notblank=El correo es obligatorio
login.correo.email=El correo no tiene un formato válido
login.clave.notblank=La clave es obligatoria

# OrdenServicioRequest
ordenServicio.numeroOrden.notblank=El número de orden es obligatorio
ordenServicio.numeroOrden.size=El número de orden no puede superar los 20 caracteres
ordenServicio.idCliente.notnull=El cliente es obligatorio
ordenServicio.idUsuario.notnull=El técnico es obligatorio
ordenServicio.equipo.notblank=El equipo es obligatorio
ordenServicio.equipo.size=El equipo debe tener entre 3 y 100 caracteres
ordenServicio.marca.size=La marca no puede superar los 60 caracteres
ordenServicio.modelo.size=El modelo no puede superar los 60 caracteres
ordenServicio.numeroSerie.size=El número de serie no puede superar los 60 caracteres
ordenServicio.descripcionFalla.notblank=La descripción de la falla es obligatoria
ordenServicio.descripcionFalla.size=Describe la falla con al menos 10 caracteres
ordenServicio.costoEstimado.notnull=El costo estimado es obligatorio
ordenServicio.costoEstimado.positiveorzero=El costo estimado no puede ser negativo
ordenServicio.costoFinal.positiveorzero=El costo final no puede ser negativo

# ProductoRequest
producto.codigo.notblank=El código del producto es obligatorio
producto.codigo.size=El código no puede superar los 30 caracteres
producto.nombre.notblank=El nombre del producto es obligatorio
producto.nombre.size=El nombre debe tener entre 3 y 150 caracteres
producto.descripcion.size=La descripción no puede superar los 300 caracteres
producto.idCategoria.notnull=La categoría es obligatoria
producto.unidadMedida.notnull=La unidad de medida es obligatoria
producto.precioCompra.notnull=El precio de compra es obligatorio
producto.precioCompra.positiveorzero=El precio de compra no puede ser negativo
producto.precioVenta.notnull=El precio de venta es obligatorio
producto.precioVenta.positive=El precio de venta debe ser mayor a cero
producto.stock.notnull=El stock es obligatorio
producto.stock.positiveorzero=El stock no puede ser negativo
producto.stockMinimo.notnull=El stock mínimo es obligatorio
producto.stockMinimo.positiveorzero=El stock mínimo no puede ser negativo
producto.margenValido.asserttrue=El precio de venta no puede ser menor al precio de compra

