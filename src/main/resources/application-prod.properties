# =====================================================================
#  Perfil de PRODUCCION (SPRING_PROFILES_ACTIVE=prod)
#
#  Se suma a application.properties y cambia solo lo que en un servidor
#  real debe ser distinto. Lo usan Docker (docker-compose.yml) y Tomcat en
#  las VMs (setenv: SPRING_PROFILES_ACTIVE=prod).
# =====================================================================

# Sin las consultas SQL en el log: menos escritura en disco y no expone datos.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Log mas sobrio: solo avisos y errores de librerias, informacion de SIVER.
logging.level.root=WARN
logging.level.com.refricentro.siver=INFO
logging.level.org.springframework.boot.web=INFO
logging.level.org.apache.catalina.startup=INFO

# Los errores no devuelven el stacktrace al cliente.
server.error.include-stacktrace=never
server.error.include-message=never

# Pool de conexiones a MySQL dimensionado para el servidor.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=10000
