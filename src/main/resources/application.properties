# ===== Aplicacion =====
spring.application.name=siver
server.port=8080

# ===== Conexion a MySQL =====
spring.datasource.url=jdbc:mysql://localhost:3306/siver_bd?useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=araestore2025
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
# validate: compara las entidades con las tablas existentes SIN modificarlas
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===== Formato de fechas en las respuestas JSON =====
spring.jackson.time-zone=America/Lima
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
# ===== Seguridad JWT =====
# La clave secreta con la que se firman los tokens. Debe tener al menos
# 32 caracteres porque el algoritmo HS256 lo exige.
# En un proyecto real esto NO va en el repositorio: se lee de una variable
# de entorno. Aqui se deja visible para que el equipo pueda probar.
siver.jwt.secret=SIVER-Refricentro-Peregrino-Clave-Secreta-2026-UPN
# 8 horas, una jornada de trabajo
siver.jwt.expiracion-ms=28800000
