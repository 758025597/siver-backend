# =====================================================================
#  VM-Frontend: sitio de SIVER en Apache HTTP Server
#
#  Ubuntu:   sudo cp siver-apache.conf /etc/apache2/sites-available/siver.conf
#            sudo a2enmod rewrite headers deflate
#            sudo a2dissite 000-default && sudo a2ensite siver
#            sudo systemctl reload apache2
#  Windows:  pegar el bloque <Directory> en C:\Apache24\conf\httpd.conf,
#            cambiar DocumentRoot a "C:/Apache24/htdocs/siver" y quitar el #
#            de LoadModule rewrite_module, headers_module y deflate_module.
#
#  Los archivos de Angular (dist/siver-frontend/browser/*, incluido el
#  .htaccess) se copian en DocumentRoot.
# =====================================================================
<VirtualHost *:80>
    ServerName siver.local
    DocumentRoot /var/www/siver

    <Directory /var/www/siver>
        Options -Indexes +FollowSymLinks
        # Permite que el .htaccess de Angular redirija las rutas a index.html
        AllowOverride All
        Require all granted
    </Directory>

    # Compresion: menos datos por la red
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/css application/javascript application/json image/svg+xml
    </IfModule>

    ServerSignature Off
    ErrorLog ${APACHE_LOG_DIR}/siver-error.log
    CustomLog ${APACHE_LOG_DIR}/siver-access.log combined
</VirtualHost>
