# ===== Aplicacion =====
spring.application.name=siver
server.port=8080

# ===== Variables de entorno =====
# Credenciales y claves NO van en este archivo (ni en el repositorio).
# Se leen de variables de entorno:
#   - en desarrollo: del archivo .env de esta carpeta (esta en .gitignore;
#     copiar .env.example como .env y completar los valores)
#   - en Tomcat:     de bin/setenv.sh o bin/setenv.bat del servidor
#   - en Docker:     de la seccion environment del docker-compose.yml
# Lo que esta despues de ':' es el valor por defecto si la variable no existe.
spring.config.import=optional:file:.env[.properties]

# ===== Conexion a MySQL =====
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:siver_bd}?useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
# validate: compara las entidades con las tablas existentes SIN modificarlas
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===== Paginacion =====
# La primera pagina es la 0. Si el cliente pide size=1000, Spring lo baja
# a 50: asi nadie puede traerse la tabla entera de un solo golpe.
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=50

# ===== Swagger / OpenAPI =====
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# ===== Formato de fechas en las respuestas JSON =====
spring.jackson.time-zone=America/Lima
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
# ===== Seguridad JWT =====
# La clave secreta con la que se firman los tokens. Debe tener al menos
# 32 caracteres porque el algoritmo HS256 lo exige. Viene de la variable
# de entorno JWT_SECRET: si no esta definida, la aplicacion no arranca.
siver.jwt.secret=${JWT_SECRET}
# 8 horas por defecto, una jornada de trabajo
siver.jwt.expiracion-ms=${JWT_EXPIRACION_MS:28800000}

# ===== CORS =====
# Origenes (direccion y puerto) desde donde se sirve el frontend, separados
# por coma. Ejemplo en las VMs: http://192.168.56.10,http://192.168.56.10:80
siver.cors.origenes=${CORS_ORIGINS:http://localhost:4200}

# ===== Correo (notificaciones) =====
# Si MAIL_HABILITADO=false las notificaciones solo se ven dentro del sistema.
siver.mail.habilitado=${MAIL_HABILITADO:false}
siver.mail.remitente=${MAIL_FROM:siver@refricentro.pe}
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
