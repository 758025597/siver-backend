# ===== Aplicacion =====
spring.application.name=siver
server.port=8080

# ===== Conexion a MySQL =====
spring.datasource.url=jdbc:mysql://localhost:3306/siver_bd?useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=araestore2025
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
# validate: compara las entidades con las tablas existentes SIN modificarlas
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===== Formato de fechas en las respuestas JSON =====
spring.jackson.time-zone=America/Lima
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss